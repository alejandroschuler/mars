# Optional earth-conformance check (VALIDATION_PLAN.md, "Inherited workflows
# and CI"; T05 issue #7, deliverable 4): started by hand only, never on a
# push or a pull request. Installs R and earth 5.3.4 (the version
# validation/harness/'s scripts and docs/algorithm.md's blackbox experiments
# were run against), plus jsonlite (the harness's JSON wire format) and nnet
# (the multiclass reference, "Binary outcomes"), then regenerates every
# fixture under validation/fixtures/ and fails if any of them differ
# (validation/README.md, "Fixture generator").
#
# Caveat (review round 1, #42 finding 8): gen_fixtures.py --check compares
# every stored double exactly. The committed fixtures were made on macOS
# arm64; this job runs on ubuntu-latest (x86_64), a different compiler,
# libm and BLAS, so a last-bit difference in a transcendental function
# (exp, sin) or a BLAS routine can make it fail with no change to the
# harness or the datasets. validation/README.md, "Fixture generator",
# states this; a failure here needs a by-hand look at *which* bits
# differ (a real code change vs. last-bit platform noise) before it is
# taken as a regression.
name: earth conformance

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.11.11"

defaults:
  run:
    shell: bash

jobs:
  check-fixtures:
    name: gen_fixtures.py --check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: "4.4.3"

      - name: Install earth 5.3.4, jsonlite and nnet
        run: |
          Rscript -e 'install.packages(c("jsonlite", "nnet", "remotes"), repos = "https://cloud.r-project.org")'
          Rscript -e 'remotes::install_version("earth", version = "5.3.4", repos = "https://cloud.r-project.org")'
          Rscript -e 'library(earth); library(jsonlite); library(nnet); cat("earth", as.character(packageVersion("earth")), "\n")'

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          cache-suffix: ${{ github.job }}

      - run: uv run --frozen --group validation python validation/harness/gen_fixtures.py --check
