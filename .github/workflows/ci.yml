# Lean CI for pymars 2.0 (VALIDATION_PLAN.md, "Inherited workflows and CI"):
# ruff, the fast tests on three operating systems, the slow tests, the lowest
# direct dependency versions and a wheel build. No secrets and no publishing.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The uv release that made uv.lock; the local gates use the same one.
  UV_VERSION: "0.11.11"
  HYPOTHESIS_PROFILE: ci
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: ruff and uv.lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          cache-suffix: ${{ github.job }}
      - run: uv lock --check
      - run: uv run --frozen ruff check --output-format=github
      - run: uv run --frozen ruff format --check

  fast:
    name: fast tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.12" }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          cache-suffix: ${{ github.job }}
      - run: uv run --frozen --group validation pytest -m "not slow and not external"

  slow:
    name: slow tests (ubuntu-latest, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          cache-suffix: ${{ github.job }}
      # The exit-code-5 exception holds only while no slow test exists. It goes
      # once slow tests exist: task T15 removes it.
      - name: Run the slow tests (pytest exit code 5 means that none exist yet)
        run: |
          status=0
          uv run --frozen --group validation pytest -m "slow and not external" || status=$?
          if [ "$status" -eq 5 ]; then
            echo "No slow tests are collected yet."
            status=0
          fi
          exit "$status"

  lowest:
    name: lowest direct dependencies (ubuntu-latest, Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.10"
          cache-suffix: ${{ github.job }}
      - name: Install numpy, scipy and scikit-learn at their lowest allowed versions
        run: |
          uv venv
          uv pip install --resolution lowest-direct -r pyproject.toml
          uv pip freeze | tee "$RUNNER_TEMP/lowest.txt"
          uv pip install --no-deps .
      # The floors of the validation group must work with the runtime floors,
      # which the constraint file keeps. joblib stays at the release that
      # scikit-learn brought in.
      - name: Install the validation group at its lowest allowed versions
        run: |
          uv pip install --resolution lowest-direct \
            --constraint "$RUNNER_TEMP/lowest.txt" --group validation
      - name: Install the test tools without changing those versions
        run: uv pip install --constraint "$RUNNER_TEMP/lowest.txt" pytest hypothesis
      - run: .venv/bin/pytest -m "not slow and not external"

  wheel:
    name: wheel build and smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          cache-suffix: ${{ github.job }}
      - run: uv build
      - name: Check that the wheel is pure Python
        run: ls dist/mars_earth-*-py3-none-any.whl
      - name: Install the wheel into a fresh venv and run the smoke check
        run: |
          uv venv "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" dist/mars_earth-*-py3-none-any.whl
          "$RUNNER_TEMP/wheel-venv/bin/python" -I -c '
          import importlib.metadata
          import pymars
          assert pymars.__version__ == importlib.metadata.version("mars-earth")
          assert "site-packages" in pymars.__file__, pymars.__file__
          if hasattr(pymars, "Earth"):
              import numpy as np
              X = np.random.default_rng(0).uniform(size=(100, 3))
              y = X[:, 0] + np.maximum(X[:, 1] - 0.5, 0.0)
              assert np.isfinite(pymars.Earth().fit(X, y).predict(X)).all()
          print("smoke check passed:", pymars.__version__, pymars.__file__)
          '
