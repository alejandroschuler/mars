[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mars-earth"
version = "2.0.0.dev0"
description = "Multivariate adaptive regression splines (MARS) in pure Python, with a scikit-learn API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Dylan A Mordaunt", email = "dylan@mordaunt.dev" },
    { name = "Alejandro Schuler" },
]
keywords = ["mars", "multivariate adaptive regression splines", "earth", "scikit-learn", "regression"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# dev/DECISIONS.md gives the reasons for these floors.
dependencies = [
    "numpy>=1.23.5",
    "scipy>=1.9.3",
    "scikit-learn>=1.6",
]

[project.urls]
Homepage = "https://github.com/alejandroschuler/mars"
Repository = "https://github.com/alejandroschuler/mars"
Issues = "https://github.com/alejandroschuler/mars/issues"
Changelog = "https://github.com/alejandroschuler/mars/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "ruff>=0.9",
    "pandas>=2",
]
# For the harness, the simulations and the benchmarks; never shipped.
validation = [
    "pandas>=2",
    "joblib>=1.3",
    "matplotlib>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["pymars"]

[tool.hatch.build.targets.sdist]
include = ["/pymars", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md", "/CITATION.cff"]

[tool.ruff]
line-length = 88
target-version = "py310"
# The legacy prototypes stay as they were run, and the code in Markdown files
# (which ruff 0.16 would format) is example text, so ruff leaves both alone.
extend-exclude = ["validation/legacy", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF", "NPY", "PIE", "N"]
# Capital names such as X, Y and B follow scikit-learn and the math.
ignore = ["N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["pymars"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["slow: a long test; gate A and the fast CI jobs skip it"]
xfail_strict = true
# Warnings are errors, except deprecations that other packages raise.
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "error::DeprecationWarning:pymars",
    "error::PendingDeprecationWarning:pymars",
]

[tool.coverage.run]
source = ["pymars"]

[tool.coverage.report]
fail_under = 90
show_missing = true
